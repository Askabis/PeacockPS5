name: Read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install --yes clang-18 lld-18 make wget unzip
      - name: Prepare SDK
        run: bash tools/setup-native-dependencies.sh
      - name: Build diagnostic
        run: make -C diagnostic PS5_PAYLOAD_SDK="$PWD/.deps/native/ps5-payload-sdk" PS5_CLANG="$(command -v clang-18)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PeacockPS5-read-only-${{ github.sha }}
          path: diagnostic/peacockps5-inspect.elf
          if-no-files-found: error
